[project]
name = "backend-integration-demo"
version = "0.1.0"
description = "Demo API for importing a supplier's product catalog"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pika>=1.3,<2",
    "prometheus-fastapi-instrumentator>=7,<8",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pymongo>=4.12,<5",
    "redis>=5.2,<8",
    "uvicorn>=0.34,<1",
    "weaviate-client>=4.14,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
